<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><!--clo-title--></title>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --bg:#ffffff; --border:#d0d7de; --accent:#0969da; --panel:#f6f8fa; }
  @media (prefers-color-scheme: dark){ :root{ --fg:#e6edf3; --muted:#8b949e; --bg:#0d1117; --border:#30363d; --accent:#4493f8; --panel:#161b22; } }
  html,body{ margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px 72px; }
  header.bar{ position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border); padding:12px 16px; font-size:13px; color:var(--muted); }
  header.bar code{ color:var(--fg); background:var(--panel); padding:1px 5px; border-radius:5px; }
  header.bar a{ color:var(--accent); text-decoration:none; } header.bar a:hover{ text-decoration:underline; }
  h1.title{ font-size:20px; margin:22px 0 8px; }
  .prose{ text-align:left; line-height:1.55; }
  .prose h1,.prose h2{ border-bottom:1px solid var(--border); padding-bottom:.3em; }
  .prose code{ background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 5px; font-size:.9em; }
  .prose pre{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; }
  .prose pre code{ border:0; padding:0; background:none; }
  .prose table{ border-collapse:collapse; } .prose th,.prose td{ border:1px solid var(--border); padding:6px 10px; }
  .prose a{ color:var(--accent); text-decoration:underline; } .prose a:visited{ color:var(--accent); }
  .prose blockquote{ margin:12px 0; padding:2px 14px; border-left:3px solid var(--border); color:var(--muted); }
</style>
</head>
<body>
<header class="bar"><!--clo-nav--></header>
<div class="wrap">
  <h1 class="title"><!--clo-title--></h1>
  <div class="prose"><!--clo-body--></div>
</div>
</body>
</html>
