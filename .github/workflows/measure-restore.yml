name: measure-restore
# Reproducible measurement of the High Performance restore payoff on the same
# runner class (ubuntu-latest) as CLO.md's other timings. Restores the published
# release's prebuilt objects and runs the adapter with zero local compilation,
# printing per-phase wall-clock. Re-run from the Actions tab to re-measure.
on:
  workflow_dispatch:
  push:
    tags:
      - 'measure-*'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore the release and run the adapter (timed, no compilation)
        run: |
          set -euo pipefail
          echo "MEASURE STARTED $(date -u +%H:%M:%S)"
          t0=$(date +%s)
          ./dk1 restore github-l2 jonahbeckford/ocamlearlybird
          t1=$(date +%s); echo "RESTORE seconds=$((t1-t0))"
          ./dk1 run-object NotHackwaly_Ocamlearlybird.Ocamlearlybird@1.3.6 \
            -s Release.Linux_x86_64 -m ./bin/ocamlearlybird.exe -- --help=plain
          t2=$(date +%s); echo "RUNOBJECT seconds=$((t2-t1))"
          echo "PAYOFF total=$((t2-t0))s restore=$((t1-t0))s runobject=$((t2-t1))s"
          echo "MEASURE DONE $(date -u +%H:%M:%S)"
